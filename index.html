<style>
/* Layout: glass status header with live stats and activity, segmented tabs, search + command bar, song list opening into a version timeline; player with visualizer and synced lyric docks to the bottom */
:root{
  --bg:#0a0812; --bg2:#100c1c; --panel:#141022; --panel2:#1b1630; --fg:#ece8f8; --muted:#9a91b6; --line:#272040; --chip:#211b36;
  --accent:#a47cff; --accent-2:#d48bff; --accent-fg:#120a24; --accent-soft:#2a1f4d; --glow:rgb(164 124 255 / .35);
  --amber:#ffb65c; --amber-soft:#3a2a18; --danger:#ff6b8a; --live:#6af0c4;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f5f3fb; --bg2:#ece8f8; --panel:#ffffff; --panel2:#f3effd; --fg:#16111f; --muted:#625a7a; --line:#e2dcf2; --chip:#efeafb;
  --accent:#6a3de8; --accent-2:#a04ee0; --accent-fg:#ffffff; --accent-soft:#ebe3ff; --glow:rgb(106 61 232 / .22);
  --amber:#a35b07; --amber-soft:#fbecd6; --danger:#c22e52; --live:#118a63; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f5f3fb; --bg2:#ece8f8; --panel:#ffffff; --panel2:#f3effd; --fg:#16111f; --muted:#625a7a; --line:#e2dcf2; --chip:#efeafb;
  --accent:#6a3de8; --accent-2:#a04ee0; --accent-fg:#ffffff; --accent-soft:#ebe3ff; --glow:rgb(106 61 232 / .22);
  --amber:#a35b07; --amber-soft:#fbecd6; --danger:#c22e52; --live:#118a63; color-scheme:light}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 0;display:grid;gap:10px}
.row1{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.5vw,32px);margin:0;letter-spacing:-.01em}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--live)}
.dot.warn{background:var(--amber)}
.status button{font:12px var(--mono);background:none;border:1px solid var(--line);color:var(--fg);border-radius:5px;padding:3px 8px;cursor:pointer}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{font:600 14px var(--body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 10px;cursor:pointer;white-space:nowrap}
.tab .n{font:400 12px var(--mono);margin-left:6px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main .wrap{padding-block:16px 160px;display:grid;gap:14px}
.banner{border-radius:7px;padding:10px 12px;font-size:14px;background:var(--amber-soft);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.banner button{font:600 13px var(--body);border:0;border-radius:6px;padding:6px 10px;background:var(--fg);color:var(--bg);cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input,.bar select{font:14px var(--body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.bar input{flex:1 1 220px}
.count{font:12px var(--mono);color:var(--muted);margin-left:auto}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.song{border-top:1px solid var(--line)}
.song:first-child{border-top:0}
.song>button.head{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:12px 14px}
.song>button.head:hover{background:var(--chip)}
.song>button.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.sub{grid-column:1/-1;font:12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:5px;align-items:center}
.b{font:500 11px var(--mono);border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--fg);white-space:nowrap}
.b.v{background:var(--accent-soft);color:var(--accent)}
.b.new{background:var(--accent);color:var(--accent-fg)}
.b.g{background:var(--amber-soft);color:var(--amber)}
.tl{padding:4px 14px 14px;display:grid;gap:0}
.ver{display:grid;grid-template-columns:22px 34px 1fr auto;gap:4px 10px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.ver:first-child{border-top:0}
.ver input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.vn{font:500 12px var(--mono);color:var(--muted);padding-top:2px}
.vmain{min-width:0}
.vname{overflow-wrap:anywhere;font-size:14px}
.vmeta{font:12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:2px;font-variant-numeric:tabular-nums}
.vact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:600 12.5px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:5px 9px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:22px 14px;color:var(--muted)}
.stabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 14px 6px;border-bottom:1px solid var(--line);margin:0 0 4px}
.stab{font:600 12.5px var(--body);background:none;border:1px solid transparent;border-radius:999px;color:var(--muted);padding:4px 10px;cursor:pointer}
.stab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.stab .n{font:400 11px var(--mono);margin-left:4px}
.pane{padding:6px 14px 14px;display:grid;gap:10px}
.grp{display:grid;gap:4px}
.grp h4{margin:0;font:600 13px var(--body);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.grp h4 small{font:12px var(--mono);color:var(--muted);font-weight:400}
.grp ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.grp li{font-size:13.5px;overflow-wrap:anywhere}
.jump{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.jump:focus-visible{outline:2px solid var(--accent)}
.here{color:var(--muted)}
.loc{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:grid;gap:6px}
.loc .path{font:12.5px var(--mono);overflow-wrap:anywhere;user-select:all}
.loc .lrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.b.off{background:var(--amber-soft);color:var(--amber)}
.vloc{font:12px var(--mono);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.notes{display:grid;gap:12px}
body.not-owner [data-sendsong],body.not-owner #tsend,body.not-owner #impbtn{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip small{font:400 11px var(--mono);opacity:.8;margin-left:4px}
.flag{all:unset;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:4px;color:var(--muted)}
.flag.on{color:var(--amber)}
.flag:focus-visible{outline:2px solid var(--accent)}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px}
.ctab th,.ctab td{text-align:left;padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.ctab th{font:600 12px var(--mono);color:var(--muted);border-top:0}
.ctab td.n{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.ctab input[type=text]{font:13.5px var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 7px;width:100%;box-sizing:border-box}
.grpcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.grpcard h4{margin:0;font:600 14px var(--body);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wrapx{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13.5px;margin:0}
.facts dt{color:var(--muted);font:12px var(--mono);padding-top:2px}
.facts dd{margin:0;overflow-wrap:anywhere}
.nrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notes select,.notes textarea,.notes input{font:14px var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.notes textarea{min-height:110px;resize:vertical;width:100%;box-sizing:border-box;line-height:1.5}
.notes label{font-size:12.5px;font-weight:600;display:grid;gap:4px}
.saved{font:12px var(--mono);color:var(--muted)}
.ai{background:var(--accent-soft);border-radius:7px;padding:10px 12px;font-size:14px;white-space:pre-wrap;display:grid;gap:8px}
.b.st{background:var(--fg);color:var(--bg)}
.b.fix{background:var(--danger);color:var(--bg)}
.chip.fixon{background:var(--danger);color:var(--bg);border-color:var(--danger)}
.b.hd{background:var(--chip);color:var(--fg);border:1px dashed var(--muted)}
.lyr{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lyr h3{margin:0;padding:10px 14px;font:600 13px var(--body);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lyr h3 small{font:12px var(--mono);color:var(--muted);font-weight:400}
.lhit{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;gap:2px;padding:9px 14px;border-top:1px solid var(--line)}
.lhit:first-of-type{border-top:0}
.lhit:hover{background:var(--chip)}
.lhit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lhit .ls{font-weight:600;font-size:14px}
.lhit .ll{font-size:14px;color:var(--fg)}
.lhit .ll mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}
.lhit .lm{font:12px var(--mono);color:var(--muted)}
.lyrnote{font-size:13px;color:var(--muted);padding:10px 14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--fg);color:var(--bg);border-radius:8px;padding:9px 14px;font-size:13.5px;max-width:min(520px,calc(100vw - 32px))}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.implog{font:12px var(--mono);max-height:160px;overflow:auto;background:var(--bg);border-radius:6px;padding:8px 10px;display:grid;gap:2px}
.plain{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:12.5px var(--mono);columns:2 260px;column-gap:24px}
.plain div{break-inside:avoid;padding:2px 0;overflow-wrap:anywhere}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{padding-block:10px;display:grid;gap:8px}
.player{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.player .pt{font-size:13.5px;font-weight:600;min-width:0;flex:1 1 200px;overflow-wrap:anywhere}
.player audio{width:100%;max-width:420px;height:34px}
.tray{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tray .tc{font-size:14px;flex:1 1 auto}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.dlg{padding:18px;display:grid;gap:12px}
.dlg h2{font-family:var(--display);font-size:20px;margin:0}
.dlg label{font-size:13px;font-weight:600;display:grid;gap:4px}
.dlg input,.dlg textarea{font:14px var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.dlg textarea{min-height:70px;resize:vertical}
.opts{display:grid;gap:6px}
.opts label{font-weight:400;display:flex;gap:8px;align-items:flex-start;font-size:14px}
.sel{font:12.5px var(--mono);background:var(--bg);border-radius:6px;padding:8px 10px;max-height:140px;overflow:auto;display:grid;gap:3px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:13.5px}
.okmsg{color:var(--accent);font-size:13.5px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:560px){.song>button.head{grid-template-columns:1fr}.ver{grid-template-columns:22px 28px 1fr}.vact{grid-column:3;justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== redesign ===== */
body{background:radial-gradient(900px 420px at 15% -10%,var(--accent-soft),transparent 60%),radial-gradient(700px 380px at 110% 0%,color-mix(in srgb,var(--accent-2) 14%,transparent),transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.18;mask-image:linear-gradient(#000,transparent 70%)}
main{position:relative;z-index:1}
header.top{position:sticky;z-index:6}
.dock{z-index:6}
header.top{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
body::before{background:var(--bg)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.6vw,26px);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
h1 .mark{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,var(--accent),var(--accent-2),var(--accent));box-shadow:0 0 18px var(--glow);display:inline-grid;place-items:center;color:var(--accent-fg);font:700 12px var(--display)}
.status{gap:10px}
.status button,.kbd{font:500 12px var(--mono);background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:4px 9px;cursor:pointer}
.kbd{display:inline-flex;gap:6px;align-items:center}
.kbd kbd{font:500 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.dot.live{box-shadow:0 0 0 4px color-mix(in srgb,var(--live) 22%,transparent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--live) 6%,transparent)}}
.tabs{gap:4px;padding-bottom:10px}
.tab{border:1px solid transparent;border-radius:999px;padding:6px 12px;font:500 13.5px var(--body)}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--fg);border-bottom-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tab:hover{color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px}.stat b{font-size:18px}.stat span{font-size:11px}}
.axis{display:grid;font:10px var(--mono);color:var(--muted)}
.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;position:relative;overflow:hidden}
.stat b{font:600 22px var(--display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.stat span{font:12px var(--mono);color:var(--muted)}
.stat i{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 10px var(--glow)}
.stat.click{cursor:pointer}.stat.click:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.activity{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 8px;display:grid;gap:6px}
.activity .hd{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted)}
.activity svg{width:100%;height:72px;display:block}
.bar input,.bar select{background:var(--panel);border-radius:10px;padding:10px 12px;border-color:var(--line)}
.bar input:focus,.bar select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.list{border-radius:16px;background:var(--panel);box-shadow:0 1px 0 rgb(255 255 255 / .03) inset,0 20px 50px -30px rgb(0 0 0 / .6)}
.song{transition:background .15s;position:relative}
.qact{position:absolute;right:14px;top:14px;z-index:2;justify-content:flex-end;gap:6px;flex-wrap:nowrap}
.qact .btn{padding:4px 10px}

.song>button.head{padding:14px clamp(64px,12vw,130px) 14px 16px;position:relative}
.song>button.head:hover{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.song>button.head[aria-expanded="true"]{background:linear-gradient(90deg,var(--accent-soft),transparent 80%)}
.song>button.head[aria-expanded="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px var(--glow)}
.t{font-weight:600;font-size:15px;letter-spacing:.005em}
.b{border-radius:999px;padding:2px 8px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.b.v{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.b.new{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:var(--accent-fg);border-color:transparent}
.b.g{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.b.st{background:var(--fg);color:var(--bg);border-color:transparent}
.b.fix{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn{border-radius:9px;background:var(--panel2);border-color:var(--line);transition:border-color .15s,box-shadow .15s,transform .05s}
.btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-fg);box-shadow:0 6px 20px -8px var(--glow)}
.chip{border-radius:999px;background:var(--panel2)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}
.stabs{gap:6px;padding:4px 16px 10px}
.stab{border-radius:999px;border:1px solid var(--line);padding:5px 11px}
.stab[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.ver{border-top-style:solid;border-top-color:color-mix(in srgb,var(--line) 70%,transparent)}
.vn{font-family:var(--display);font-size:11px;color:var(--accent)}
.loc,.grpcard,.lyr,.wrapx,.plain{border-radius:14px}
.ai{background:linear-gradient(135deg,var(--accent-soft),var(--panel2));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px}
.dock{background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.player{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.player .pt{grid-column:1/-1}
.player canvas{width:100%;height:42px;display:block;border-radius:8px;background:var(--bg2)}
.lyrnow{grid-column:1/-1;font-size:15px;min-height:22px;color:var(--fg);transition:opacity .2s}
.lyrnow small{color:var(--muted);font:12px var(--mono);margin-left:8px}
dialog{border-radius:18px;background:var(--panel);box-shadow:0 30px 80px -20px rgb(0 0 0 / .7),0 0 0 1px var(--line)}
dialog::backdrop{background:rgb(8 5 16 / .6);backdrop-filter:blur(4px)}
/* command palette */
#cmdk{width:min(640px,calc(100vw - 24px));padding:0;top:12vh;margin-top:0}
#cmdk input{width:100%;box-sizing:border-box;font:500 17px var(--body);padding:18px 20px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg)}
#cmdk input:focus{outline:none}
#cmdkres{max-height:min(60vh,520px);overflow:auto;padding:6px}
.ck{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}
.ck[aria-selected="true"],.ck:hover{background:var(--accent-soft)}
.ck .ic{color:var(--accent);font:600 13px var(--mono);text-align:center}
.ck .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck .tx small{display:block;color:var(--muted);font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck .hint{font:11px var(--mono);color:var(--muted)}
.ckhd{font:600 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:10px 12px 4px}
.ckfoot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font:12px var(--mono);color:var(--muted);flex-wrap:wrap}
/* ask */
#ask .dlg{max-height:calc(100vh - 80px)}
#askout{display:grid;gap:10px;max-height:52vh;overflow:auto}
.qa{display:grid;gap:6px}
.qa .q{justify-self:end;background:var(--accent-soft);border-radius:12px 12px 4px 12px;padding:8px 12px;max-width:85%}
.qa .a{background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:10px 12px;white-space:pre-wrap;line-height:1.5}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sim{display:grid;gap:6px}
.sim .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.meter{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;width:90px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}


.list,.song{scroll-margin-top:calc(var(--hh,0px) + 84px)}
/* sticky search: rides under the header wherever you are in the list */
.bar{position:sticky;top:var(--hh,0px);z-index:4;margin:0 -12px;padding:10px 12px;border-radius:0 0 14px 14px;transition:background .2s,box-shadow .2s}
body.scrolled header.top{background:color-mix(in srgb,var(--bg) 94%,transparent)}
body.scrolled .bar{background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 12px 24px -18px rgb(0 0 0 / .6),0 1px 0 var(--line)}
@media (max-width:640px){
  body.scrolled header.top .status{display:none}
  body.scrolled header.top h1{font-size:17px}
  body.scrolled header.top h1 .mark{width:20px;height:20px}
  .bar select{flex:1 1 40%}
  body.scrolled .bar .count{display:none}
}

/* now playing / loading on the nameplate */
.t .pg{display:inline-block;width:0;transition:width .2s}
.song.playing .t .pg,.song.loading .t .pg{width:14px;height:12px;margin-right:8px;vertical-align:-1px;background:linear-gradient(var(--accent),var(--accent)) 0 100%/3px 40% no-repeat,linear-gradient(var(--accent),var(--accent)) 5px 100%/3px 90% no-repeat,linear-gradient(var(--accent),var(--accent)) 10px 100%/3px 60% no-repeat;animation:eq 1s ease-in-out infinite}
.song.loading .t .pg{animation:eqload .8s linear infinite;opacity:.7}
@keyframes eq{0%,100%{background-size:3px 40%,3px 90%,3px 60%}33%{background-size:3px 90%,3px 30%,3px 80%}66%{background-size:3px 60%,3px 70%,3px 30%}}
@keyframes eqload{50%{opacity:.25}}
.song.playing .t{color:var(--accent)}
.spin{display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;vertical-align:-1px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.song.playing .t .pg,.spin{animation:none}}
</style>
